[project]
name = "system-one-models"
version = "0.1.0"
description = "System One models — Jev and the LangChain TypeSafe integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "jes==0.0.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.0.0",
    "langchain-typesafe[experimental]==0.0.1a3",
    "langsmith",
    "openai>=1.0",
    "pillow>=11",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
browser-agent = [
    "jev-ultrafast ; python_full_version >= '3.12'",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.uv.sources]
jev-ultrafast = { git = "https://github.com/browser-use/jev-ultrafast" }
